<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circus of Value</title>
    <!-- 外部ライブラリ：紙吹雪（canvas-confetti）の読み込み -->
    <style>
        :root {
            --bg-color: #121214;
            --surface-color: #1e1e24;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --accent-color: #10b981;
            --danger-color: #ef4444;
            --font-sans: 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        button.secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        button.danger {
            background-color: var(--danger-color);
        }

        button.danger:hover {
            background-color: #dc2626;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (min-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr 500px;
            }
        }

        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .wheel-container:active {
            cursor: grabbing;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid var(--accent-color);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .editor-section {
            background-color: var(--surface-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-height: 85vh;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        .item-row {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
        }

        .item-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        .input-group-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"], input[type="color"], textarea {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
        }

        input[type="color"] {
            padding: 0;
            height: 38px;
            width: 50px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        input[type="text"]:focus, textarea:focus {
            outline: 2px solid var(--primary-color);
            border-color: transparent;
        }

        .io-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: auto;
        }

        .hidden-file-input {
            display: none;
        }

        /* ポップアップ UI モーダル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-window {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
        }

        .modal-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            background-color: rgba(0,0,0,0.2);
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            display: none;
        }

        .modal-description {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1rem;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="app-title">Circus of Value</h1>
        <div class="header-controls">
            <div class="toggle-container">
                <label for="sound-toggle" id="lbl-sound">Sound FX</label>
                <input type="checkbox" id="sound-toggle" checked style="width: 18px; height: 18px; cursor: pointer;">
            </div>
            <button id="lang-btn" class="secondary">日本語</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 左側：ホイール描画セクション -->
        <div class="wheel-section">
            <div class="wheel-pointer"></div>
            <div class="wheel-container" id="wheel-container">
                <canvas id="wheel-canvas" width="800" height="800"></canvas>
            </div>
        </div>

        <!-- 右側：コンテンツ編集管理セクション -->
        <div class="editor-section">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                <h2 id="editor-title" style="font-size: 1.2rem;">Manage Contents</h2>
                <button id="add-item-btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">+ Add Item</button>
            </div>
            
            <div class="items-list" id="items-list">
                <!-- JavaScriptによって動的にアイテム行が挿入されます -->
            </div>

            <div class="io-buttons">
                <button id="export-btn" class="secondary">Export JSON</button>
                <button id="import-btn" class="secondary">Import JSON</button>
            </div>
            <input type="file" id="import-file" class="hidden-file-input" accept=".json">
        </div>
    </div>

    <!-- 勝者発表用ポップアップ UI モーダル -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-window">
            <h2 class="modal-title" id="modal-title">Winner!</h2>
            <img class="modal-img" id="modal-img" src="" alt="Winner Visual Presentation">
            <p class="modal-description" id="modal-description"></p>
	    <button id="m-lang-btn" class="secondary">English</button>
            <button id="modal-close">OK</button>
        </div>
    </div>

    <script>
    class WheelApp {
        constructor() {
            // 設定値と初期言語
            this.settings = {
                language: 'en',
                soundEnabled: true
            };

            // 初期収録コンテンツデータ (2個以上を維持)
            this.items = [
                {
                    id: 1,
                    text: { en: "Sushi Pack", ja: "特上寿司セット" },
                    desc: { en: "Traditional premium choice from Japan.", ja: "最高級の新鮮なネタを贅沢に使用した大満足セット。" },
                    image: "",
                    color: "#eab308"
                },
                {
                    id: 2,
                    text: { en: "Burger Meal", ja: "ダブルチーズバーガー" },
                    desc: { en: "Classic juicy double patty American fast food.", ja: "ジューシーな肉厚パティが2枚入った定番アメリカンフード。" },
                    image: "",
                    color: "#ef4444"
                },
                {
                    id: 3,
                    text: { en: "Ramen Bowl", ja: "特製醤油ラーメン" },
                    desc: { en: "Savory slow-cooked rich bone broth soup.", ja: "じっくり煮込んだ特製コク深スープと自家製チャーシュー。" },
                    image: "",
                    color: "#3b82f6"
                }
            ];

            // 物理シミュレーション用変数群
            this.currentAngle = 0;
            this.angularVelocity = 0;
            this.isDragging = false;
            this.isSpinning = false;
            this.lastAngle = 0;
            this.lastMoveTime = 0;
            this.velocitySamples = [];
            
            // キャンバス中心座標キャッシュ
            this.centerX = 400;
            this.centerY = 400;

            // 物理詳細設定
            this.config = {
                friction: 0.984  // 自然な減速を生む摩擦係数
            };

            // オーディオコンテキスト（Web Audio APIによる波形合成）
            this.audioCtx = null;
            this.synthTimeout = null;

            // DOM要素の自動バインド
            this.initDOM();
            this.init();
        }

        initDOM() {
            this.els = {
                appTitle: document.getElementById('app-title'),
                editorTitle: document.getElementById('editor-title'),
                lblSound: document.getElementById('lbl-sound'),
                soundToggle: document.getElementById('sound-toggle'),
                langBtn: document.getElementById('lang-btn'),
                canvas: document.getElementById('wheel-canvas'),
                ctx: document.getElementById('wheel-canvas').getContext('2d'),
                wheelContainer: document.getElementById('wheel-container'),
                itemsList: document.getElementById('items-list'),
                addItemBtn: document.getElementById('add-item-btn'),
                exportBtn: document.getElementById('export-btn'),
                importBtn: document.getElementById('import-btn'),
                importFile: document.getElementById('import-file'),
                modal: document.getElementById('modal-overlay'),
                modalTitle: document.getElementById('modal-title'),
                modalImg: document.getElementById('modal-img'),
                modallangBtn: document.getElementById('m-lang-btn'),
                modalDesc: document.getElementById('modal-description'),
                modalClose: document.getElementById('modal-close')
            };
        }

        // --- WEB AUDIO API シンセサイザー効果音エンジン ---
        initAudio() {
            if (this.audioCtx) return;
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        playTick() {
            if (!this.settings.soundEnabled || !this.audioCtx) return;
            try {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(580, this.audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.18, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.04);
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        playMusic() {
            if (!this.settings.soundEnabled || !this.audioCtx) return;
            this.stopMusic();

            const playNote = () => {
                if (!this.isSpinning || this.isDragging || Math.abs(this.angularVelocity) < 0.02) return;
                
                try {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    
                    // 回転の速度に応じて音楽のピッチ（周波数）を動的に変化させる
                    const speedMultiplier = Math.min(Math.abs(this.angularVelocity) * 12, 280);
                    const baseFrequency = 240 + speedMultiplier;
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(baseFrequency, this.audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(baseFrequency * 1.15, this.audioCtx.currentTime + 0.08);
                    
                    gain.gain.setValueAtTime(0.04, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
                    
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + 0.1);
                } catch (e) {}

                // 回転速度に合わせて音が鳴るテンポ（間隔）も自動同期
                const nextTempoInterval = Math.max(60, Math.min(320, 160 / Math.abs(this.angularVelocity)));
                this.synthTimeout = setTimeout(playNote, nextTempoInterval);
            };
            playNote();
        }

        stopMusic() {
            if (this.synthTimeout) {
                clearTimeout(this.synthTimeout);
                this.synthTimeout = null;
            }
        }
        // --- 多言語ローカライズ・切り替え制御 ---
        toggleLanguage() {
            this.settings.language = this.settings.language === 'en' ? 'ja' : 'en';
            this.updateLanguageUI();
            this.saveSettings();
        }

        updateLanguageUI() {
            const isJa = this.settings.language === 'ja';
            this.els.langBtn.textContent = isJa ? 'English' : '日本語';
	    this.els.modallangBtn.textContent = isJa ? 'English' : '日本語';
            this.els.appTitle.textContent = isJa ? '価値のサーカス' : 'Circus of Value';
            this.els.editorTitle.textContent = isJa ? 'コンテンツの管理' : 'Manage Contents';
            this.els.addItemBtn.textContent = isJa ? '+ 項目を追加' : '+ Add Item';
            this.els.exportBtn.textContent = isJa ? 'JSON出力' : 'Export JSON';
            this.els.importBtn.textContent = isJa ? 'JSON読み込み' : 'Import JSON';
            this.els.modalClose.textContent = isJa ? '閉じる' : 'OK';
            
            this.renderList();
            this.drawWheel();
        }

        // --- コンテンツ一覧（リスト）の動的HTML構築 ＆ 同期 ---
        renderList() {
            this.els.itemsList.innerHTML = '';
            const isJa = this.settings.language === 'ja';

            this.items.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.dataset.id = item.id;

                row.innerHTML = `
                    <div class="item-row-header">
                        <span style="font-weight: 700; font-size: 0.85rem; color: ${item.color};">■ Segment ID: ${item.id}</span>
                        <button class="danger delete-btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">${isJa ? '削除' : 'Delete'}</button>
                    </div>
                    <div class="item-inputs-grid">
                        <div class="input-group">
                            <label>${isJa ? 'ラベル (英語)' : 'Label (EN)'}</label>
                            <input type="text" class="input-en" value="${item.text.en || ''}">
                        </div>
                        <div class="input-group">
                            <label>${isJa ? 'ラベル (日本語)' : 'Label (JA)'}</label>
                            <input type="text" class="input-ja" value="${item.text.ja || ''}">
                        </div>
                        <div class="input-group full-width">
                            <label>${isJa ? '説明文 (英語)' : 'Description (EN)'}</label>
                            <textarea class="desc-en" rows="1">${item.desc.en || ''}</textarea>
                        </div>
                        <div class="input-group full-width">
                            <label>${isJa ? '説明文 (日本語)' : 'Description (JA)'}</label>
                            <textarea class="desc-ja" rows="1">${item.desc.ja || ''}</textarea>
                        </div>
                        <div class="input-group full-width">
                            <label>${isJa ? 'メディア（画像URL、リンク、またはファイル）' : 'Media Link, URL, or Image Data'}</label>
                            <div class="input-group-row">
                                <input type="text" class="input-link" placeholder="https://... or data:image/..." value="${item.image.startsWith('data:') ? '[Base64 Image Data Encoded]' : item.image}">
                                <button class="secondary img-upload-btn" type="button" style="white-space: nowrap; font-size: 0.8rem; padding: 0.55rem 0.75rem;">File</button>
                                <input type="file" class="item-file-input" accept="image/*" style="display: none;">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>${isJa ? 'セグメントの色' : 'Color'}</label>
                            <input type="color" class="input-color" value="${item.color}">
                        </div>
                    </div>
                `;
                this.els.itemsList.appendChild(row);
            });
        }

        // --- データ更新・削除・追加のバックエンド処理 ---
        addNewItem() {
            const hue = Math.floor(Math.random() * 360);
            const randomColor = `hsl(${hue}, 70%, 45%)`;
            const nextId = this.items.length > 0 ? Math.max(...this.items.map(i => i.id)) + 1 : 1;
            
            this.items.push({
                id: nextId,
                text: { en: `New Prize ${nextId}`, ja: `新しい景品 ${nextId}` },
                desc: { en: "Description goes here.", ja: "ここに詳細な説明文が入ります。" },
                image: "",
                color: randomColor
            });
            this.renderList();
            this.drawWheel();
        }

        removeItem(id) {
            if (this.items.length <= 1) {
                alert(this.settings.language === 'ja' ? 'ルーレットには最低2つの項目が必要です。' : 'The wheel requires a minimum of 1 items.');
                return;
            }
            this.items = this.items.filter(i => i.id !== id);
            this.renderList();
            this.drawWheel();
        }

        updateItemText(id, lang, value) {
            const item = this.items.find(i => i.id === id);
            if (item) {
                item.text[lang] = value;
                this.drawWheel();
            }
        }

        updateItemDesc(id, lang, value) {
            const item = this.items.find(i => i.id === id);
            if (item) item.desc[lang] = value;
        }

        updateItemField(id, field, value) {
            const item = this.items.find(i => i.id === id);
            if (item) {
                item[field] = value;
                this.drawWheel();
            }
        }

        // --- HTML5 CANVAS ルーレット描画エンジン ---
        resizeCanvas() {
            // 親コンテナの大きさに追従
            const size = Math.min(this.els.wheelContainer.clientWidth, 600);
            this.els.canvas.style.width = size + 'px';
            this.els.canvas.style.height = size + 'px';
            this.centerX = 400;
            this.centerY = 400;
        }

        drawWheel() {
            const ctx = this.els.ctx;
            const totalSegments = this.items.length;
            if (totalSegments === 0) return;

            ctx.clearRect(0, 0, 800, 800);
            const radius = 380;
            const arcSize = (Math.PI * 2) / totalSegments;

            ctx.save();
            ctx.translate(this.centerX, this.centerY);
            ctx.rotate(this.currentAngle);

            for (let i = 0; i < totalSegments; i++) {
                const segmentStartAngle = i * arcSize;
                const segmentEndAngle = segmentStartAngle + arcSize;
                const item = this.items[i];

                // セグメント扇形の描画
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, segmentStartAngle, segmentEndAngle);
                ctx.closePath();
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgba(18,18,20,0.35)";
                ctx.stroke();

                // テキストの配置と回転マトリクス演算
                ctx.save();
                ctx.rotate(segmentStartAngle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px var(--font-sans)";
                
                const currentLabel = this.settings.language === 'ja' ? item.text.ja : item.text.en;
                const truncatedLabel = currentLabel.length > 15 ? currentLabel.substring(0, 13) + "..." : currentLabel;
                ctx.fillText(truncatedLabel, radius - 35, 0);
                ctx.restore();
            }
            ctx.restore();

            // センターキャップ・装飾ピンのオーバレイ描画
            ctx.beginPath();
            ctx.arc(this.centerX, this.centerY, 35, 0, Math.PI * 2);
            ctx.fillStyle = "#1e1e24";
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#6366f1";
            ctx.stroke();
        }
        // --- アニメーション ＆ 物理減速シミュレーションループ ---
        animateLoop() {
            const loop = () => {
                if (this.isSpinning) {
                    // 摩擦による速度の減衰
                    this.angularVelocity *= this.config.friction;
                    this.currentAngle += this.angularVelocity;

                    // ピンを通過するクリック音（Tick音）のシミュレーション計算
                    const segmentAngle = (Math.PI * 2) / this.items.length;
                    const lastTickIndex = Math.floor((this.currentAngle - this.angularVelocity) / segmentAngle);
                    const currentTickIndex = Math.floor(this.currentAngle / segmentAngle);

                    if (lastTickIndex !== currentTickIndex && Math.abs(this.angularVelocity) > 0.01) {
                        this.playTick();
                    }

                    // 完全静止時の終了判定と勝者決定
                    if (Math.abs(this.angularVelocity) < 0.001) {
                        this.isSpinning = false;
                        this.angularVelocity = 0;
                        this.stopMusic();

                        // 針の位置（真上＝1.5 * Math.PI）にあるセグメントを逆算
                        const normalizedAngle = ((1.5 * Math.PI - this.currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                        const winningIndex = Math.floor(normalizedAngle / segmentAngle) % this.items.length;
                        
                        this.displayWinner(this.items[winningIndex]);
			this.triggerConfetti();
                    }

                    this.drawWheel();
                }
                requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
        }

        // --- マウス ＆ タッチスクリーン操作の慣性速度キャプチャ ---
        handlePointerDown(e) {
            if (this.isSpinning && Math.abs(this.angularVelocity) > 0.05) return;
            
            this.isDragging = true;
            this.isSpinning = false;
            this.stopMusic();
            
            const coords = this.getPointerCoords(e);
            this.lastAngle = Math.atan2(coords.y - this.centerY, coords.x - this.centerX);
            this.angularVelocity = 0;
            this.velocitySamples = [];
            this.lastMoveTime = performance.now();

            if (this.audioCtx && this.audioCtx.state === 'suspended') {
                this.audioCtx.resume();
            }
        }

        handlePointerMove(e) {
            if (!this.isDragging) return;
            if (e.cancelable) e.preventDefault();

            const coords = this.getPointerCoords(e);
            const currentAngle = Math.atan2(coords.y - this.centerY, coords.x - this.centerX);
            const now = performance.now();
            const dt = now - this.lastMoveTime;

            let deltaAngle = currentAngle - this.lastAngle;
            // 境界ポイント（-PIからPI）を跨いだ場合の補正
            if (deltaAngle > Math.PI) deltaAngle -= Math.PI * 2;
            if (deltaAngle < -Math.PI) deltaAngle += Math.PI * 2;

            this.currentAngle += deltaAngle;
            this.lastAngle = currentAngle;

            if (dt > 0) {
                const instantVelocity = deltaAngle / (dt / 1000);
                this.velocitySamples.push({ v: instantVelocity, t: now });
                if (this.velocitySamples.length > 5) this.velocitySamples.shift();
            }
            this.lastMoveTime = now;
            this.drawWheel();
        }

        handlePointerUp() {
            if (!this.isDragging) return;
            this.isDragging = false;

            const now = performance.now();
            // 離す直前の操作から時間が経ちすぎている場合は慣性を無効化
            if (now - this.lastMoveTime > 100) {
                this.angularVelocity = 0;
                return;
            }

            // 直近のスワイプサンプルから平均初速を計算
            if (this.velocitySamples.length > 0) {
                let sum = 0;
                this.velocitySamples.forEach(s => sum += s.v);
                this.angularVelocity = sum / this.velocitySamples.length;
            }

            const absoluteVelocity = Math.abs(this.angularVelocity);
            if (absoluteVelocity > 0.15) {
                this.isSpinning = true;
                // 最大回転速度の上限キャップ
                if (absoluteVelocity > 30) {
                    this.angularVelocity = Math.sign(this.angularVelocity) * 30;
                }
                // 【重要】完全な予測不可能性を持たせるカオス要素（追加乱数エネルギー）を付与
                this.angularVelocity += Math.sign(this.angularVelocity) * (Math.random() * 0.5 + 0.1);
                
                this.playMusic();
            } else {
                this.angularVelocity = 0;
            }
        }

        getPointerCoords(e) {
            const rect = this.els.canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * 800,
                y: ((clientY - rect.top) / rect.height) * 800
            };
        }

        // --- 勝者判定・ポップアップ演出 ＆ 音声読み上げ ---
        displayWinner(item) {
            const lang = this.settings.language;
            const title = item.text[lang] || item.text['en'];
            const desc = item.desc[lang] || item.desc['en'] || '';

            this.els.modalTitle.textContent = title;
            this.els.modalDesc.textContent = desc;

            // メディア（画像/リンク）表示の出し分け
            this.els.modalImg.style.display = 'none';
            if (item.image && item.image.trim() !== "") {
                this.els.modalImg.src = item.image;
                this.els.modalImg.style.display = 'block';
            }

            
            this.els.modal.classList.add('active');
            
            // Web Speech API による音声読み上げ（Text-to-Speech）
            this.speakText(title);
        }

        closeModal() {
            this.els.modal.classList.remove('active');
        }

        speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = this.settings.language === 'ja' ? 'ja-JP' : 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        // --- 外部ライブラリ不要の軽量・高速紙吹雪システム ---
        triggerConfetti() {
            const colors = ['#6366f1', '#10b981', '#ef4444', '#eab308', '#ec4899', '#3b82f6', '#f97316', '#8b5cf6', '#14b8a6', '#f43f5e', '#22d3ee', '#f59e0b', '#636e72', '#84cc16'];
            const particles = [];
            
            // ポップアップの背景に干渉しないよう、動的にキャンバスを生成
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.pointerEvents = 'none';
            canvas.style.zindex = '999';
            document.body.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // パーティクルの初期化
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * -canvas.height - 20,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: Math.random() * 5 + 3,
                    speedX: Math.random() * 4 - 2,
                    rotation: Math.random() * 360,
                    rotSpeed: Math.random() * 8 - 4
                });
            }

            const startTime = Date.now();
            const duration = 7000; // 3秒間アニメーション

            const run = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let hasActive = false;

                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotSpeed;

                    if (p.y < canvas.height) {
                        hasActive = true;
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (Date.now() - startTime < duration && hasActive) {
                    requestAnimationFrame(run);
                } else {
                    canvas.remove(); // アニメーション終了後にキャンバスを自動破棄
                }
            };
            run();
        }


        // --- BROWSER LOCALSTORAGE 管理 ---
        saveSettings() {
            localStorage.setItem('fortune_wheel_app_items', JSON.stringify(this.items));
            localStorage.setItem('fortune_wheel_app_config', JSON.stringify(this.settings));
        }

        loadSettings() {
            const savedItems = localStorage.getItem('fortune_wheel_app_items');
            const savedConfig = localStorage.getItem('fortune_wheel_app_config');
            if (savedItems) {
                try { this.items = JSON.parse(savedItems); } catch(e){}
            }
            if (savedConfig) {
                try {
                    this.settings = { ...this.settings, ...JSON.parse(savedConfig) };
                    this.updateLanguageUI();
                } catch (e) {}
            }
        }

        // --- JSONファイルのデータインポート ＆ エクスポート ---
        exportJSON() {
            const dataStr = JSON.stringify(this.items, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'wheel_contents_setup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed) && parsed.length >= 2) {
                        this.items = parsed;
                        this.renderList();
                        this.drawWheel();
                        this.saveSettings();
                        alert(this.settings.language === 'ja' ? '設定をインポートしました。' : 'Data loaded successfully.');
                    } else {
                        alert(this.settings.language === 'ja' ? '無効なデータ形式です。最低2つのセグメントが必要です。' : 'Invalid data format. Minimum 2 items required.');
                    }
                } catch (err) {
                    alert(this.settings.language === 'ja' ? 'JSONファイルの解析に失敗しました。' : 'Failed to parse JSON file.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        handleImageUpload(event, callback) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => callback(e.target.result);
            reader.readAsDataURL(file);
        }

        // --- グローバルイベントバインディング群 ---
        bindEvents() {
            document.body.addEventListener('click', () => this.initAudio(), { once: true });
            document.body.addEventListener('touchstart', () => this.initAudio(), { once: true });

            this.els.wheelContainer.addEventListener('mousedown', (e) => this.handlePointerDown(e));
            window.addEventListener('mousemove', (e) => this.handlePointerMove(e));
            window.addEventListener('mouseup', () => this.handlePointerUp());

            // タッチスクリーン用のドラッグ・フリック操作イベント
            this.els.wheelContainer.addEventListener('touchstart', (e) => this.handlePointerDown(e), { passive: true });
            window.addEventListener('touchmove', (e) => this.handlePointerMove(e), { passive: false });
            window.addEventListener('touchend', () => this.handlePointerUp());

            // 言語切り替えボタン
            this.els.langBtn.addEventListener('click', () => this.toggleLanguage());

            // オーディオのミュート・有効化切り替え
            this.els.soundToggle.addEventListener('change', (e) => {
                this.settings.soundEnabled = e.target.checked;
                this.saveSettings();
            });

            // データ操作系（追加・エクスポート・インポート）
            this.els.addItemBtn.addEventListener('click', () => { this.addNewItem(); this.saveSettings(); });
            this.els.exportBtn.addEventListener('click', () => this.exportJSON());
            this.els.importBtn.addEventListener('click', () => this.els.importFile.click());
            this.els.importFile.addEventListener('change', (e) => this.importJSON(e));

            // ポップアップ（モーダル）のクローズ処理
	    this.els.modallangBtn.addEventListener('click', () => this.toggleLanguage());
            this.els.modalClose.addEventListener('click', () => this.closeModal());
            this.els.modal.addEventListener('click', (e) => {
                if (e.target === this.els.modal) this.closeModal();
            });

            // リスト内の各アイテム行に対するイベント委譲（クリック時：削除・ファイル選択）
            this.els.itemsList.addEventListener('click', (e) => {
                const itemEl = e.target.closest('.item-row');
                if (!itemEl) return;
                const id = parseInt(itemEl.dataset.id);

                if (e.target.classList.contains('delete-btn')) {
                    this.removeItem(id);
                    this.saveSettings();
                } else if (e.target.classList.contains('img-upload-btn')) {
                    itemEl.querySelector('.item-file-input').click();
                }
            });

            // リスト内のファイル選択時（ローカル画像をBase64に変換）
            this.els.itemsList.addEventListener('change', (e) => {
                const itemEl = e.target.closest('.item-row');
                if (!itemEl) return;
                const id = parseInt(itemEl.dataset.id);

                if (e.target.classList.contains('item-file-input')) {
                    this.handleImageUpload(e, (base64Str) => {
                        this.updateItemField(id, 'image', base64Str);
                        itemEl.querySelector('.input-link').value = "[Base64 Image Data Encoded]";
                        this.saveSettings();
                    });
                }
            });

            // リスト内のテキスト入力・カラー変更時のリアルタイム同期
            this.els.itemsList.addEventListener('input', (e) => {
                const itemEl = e.target.closest('.item-row');
                if (!itemEl) return;
                const id = parseInt(itemEl.dataset.id);

                if (e.target.classList.contains('input-en')) {
                    this.updateItemText(id, 'en', e.target.value);
                } else if (e.target.classList.contains('input-ja')) {
                    this.updateItemText(id, 'ja', e.target.value);
                } else if (e.target.classList.contains('desc-en')) {
                    this.updateItemDesc(id, 'en', e.target.value);
                } else if (e.target.classList.contains('desc-ja')) {
                    this.updateItemDesc(id, 'ja', e.target.value);
                } else if (e.target.classList.contains('input-link')) {
                    this.updateItemField(id, 'image', e.target.value);
                } else if (e.target.classList.contains('input-color')) {
                    this.updateItemField(id, 'color', e.target.value);
                }
                this.saveSettings();
            });

            // ウィンドウサイズ変更時のリサイズ対応
            window.addEventListener('resize', () => {
                this.resizeCanvas();
                this.drawWheel();
            });
        }

        // --- アプリケーションのエントリーポイント ---
        init() {
            this.loadSettings();
            this.resizeCanvas();
            this.renderList();
            this.drawWheel();
            this.bindEvents();
            this.animateLoop();
        }
    } // クラス (WheelApp) の終了

    // ページのDOM解析が完了したタイミングでアプリケーションインスタンスを生成・実行
    document.addEventListener('DOMContentLoaded', () => {
        window.wheelAppInstance = new WheelApp();
    });
    </script>
</body>
