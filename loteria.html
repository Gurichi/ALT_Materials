<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loteria Vocabulary Cards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { background: #f5f0e8; font-family: 'Nunito', sans-serif; }

  /* ── Top Control Bar ──────────────────────────────────────────────────── */
  #control-bar {
    position: sticky; top: 0; z-index: 100;
    background: #1a0a00; border-bottom: 4px solid #c8860a;
    padding: 10px 16px; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap; box-shadow: 0 3px 12px rgba(0,0,0,0.5);
  }
  #control-bar .bar-title {
    font-family: 'Bangers', cursive; color: #f0c040;
    font-size: 22px; letter-spacing: 3px; margin-right: 6px; white-space: nowrap;
  }
  #control-bar .separator {
    width: 2px; height: 28px; background: #c8860a; border-radius: 2px; margin: 0 4px;
  }
  .category-btn {
    font-family: 'Bangers', cursive; font-size: 15px; letter-spacing: 1.5px;
    padding: 5px 14px; border-radius: 6px; border: 2px solid #c8860a;
    cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.1s; white-space: nowrap;
  }
  .category-btn.mode-replace { background: #3b1a00; color: #f0c040; }
  .category-btn.mode-replace:hover, .category-btn.mode-replace.active {
    background: #c8860a; color: #1a0a00; transform: translateY(-1px);
  }
  .category-btn.mode-add { background: #002a1a; color: #40f0a0; border-color: #40f0a0; }
  .category-btn.mode-add:hover, .category-btn.mode-add.active {
    background: #40f0a0; color: #002a1a; transform: translateY(-1px);
  }
  #mode-toggle { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  #mode-toggle label {
    font-family: 'Bangers', cursive; font-size: 13px; letter-spacing: 1px;
    color: #c8860a; white-space: nowrap;
  }
  #mode-select {
    font-family: 'Bangers', cursive; font-size: 14px; letter-spacing: 1px;
    background: #3b1a00; color: #f0c040; border: 2px solid #c8860a;
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  /* View toggle */
  .view-btn {
    font-family: 'Bangers', cursive; font-size: 14px; letter-spacing: 1.5px;
    padding: 5px 14px; border-radius: 6px; border: 2px solid #6040c0;
    cursor: pointer; background: #1a0a30; color: #c0a0ff;
    transition: background 0.15s, color 0.15s; white-space: nowrap;
  }
  .view-btn:hover, .view-btn.active { background: #6040c0; color: #fff; }

  /* ── Status Bar ──────────────────────────────────────────────────────── */
  #status-bar {
    background: #2a1400; color: #c8860a; font-family: 'Bangers', cursive;
    font-size: 13px; letter-spacing: 1px; padding: 4px 16px;
    display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #3b2000;
  }
  #status-text { flex: 1; }
  .bar-controls { display: flex; align-items: center; gap: 6px; }
  .bar-controls label { font-family: 'Bangers', cursive; font-size: 13px; letter-spacing: 1px; color: #c8860a; }
  #card-count-input {
    font-family: 'Bangers', cursive; font-size: 14px; width: 58px;
    padding: 2px 6px; background: #3b1a00; color: #f0c040;
    border: 2px solid #c8860a; border-radius: 4px; text-align: center;
  }
  #card-count-input:focus { outline: none; border-color: #f0c040; }
  .bar-btn {
    font-family: 'Bangers', cursive; font-size: 13px; letter-spacing: 1px;
    padding: 2px 12px; background: #c8860a; color: #1a0a00; border: none;
    border-radius: 4px; cursor: pointer; transition: background 0.15s;
  }
  .bar-btn:hover { background: #f0c040; }

  #error-msg {
    background: #3b0000; color: #ff8080; font-family: 'Nunito', sans-serif;
    font-size: 13px; padding: 8px 16px; display: none; border-bottom: 2px solid #800000;
  }

  /* ══════════════════════════════════════════════════════════════════════
     CARDS VIEW
  ══════════════════════════════════════════════════════════════════════ */
  #cards-view { display: block; }
  #cards-container { padding: 8mm; }

  .page {
    width: 210mm; height: 297mm; margin: 0 auto 10mm; background: white;
    display: flex; flex-direction: column; gap: 4mm; padding: 6mm;
    page-break-after: always; break-after: page; box-sizing: border-box;
  }
  .page .card { flex: 1; min-height: 0; }
  .card {
    border: 4px solid #000; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 0;
  }
  .card-header {
    background: gray; color: white; text-align: center;
    font-family: 'Bangers', cursive; font-size: 18px;
    letter-spacing: 2px; padding: 3px 0; flex-shrink: 0;
  }
  .card-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr); flex: 1; min-height: 0;
    border-top: 2px solid #000;
  }
  .cell {
    border: 1.5px solid gray; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 3px;
    overflow: hidden; min-height: 0;
  }
  .cell img { width: 100%; flex: 1; min-height: 0; object-fit: contain; }

  /* ══════════════════════════════════════════════════════════════════════
     CALLER VIEW
  ══════════════════════════════════════════════════════════════════════ */
  #caller-view {
    display: none; padding: 16px; gap: 16px;
    min-height: calc(100vh - 80px);
  }
  #caller-view.active { display: flex; }

  /* Left: big current card */
  #caller-main {
    flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0;
  }
  #caller-controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .caller-btn {
    font-family: 'Bangers', cursive; font-size: 16px; letter-spacing: 2px;
    padding: 8px 22px; border-radius: 8px; border: none; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .caller-btn:active { transform: scale(0.97); }
  #btn-draw     { background: #c8860a; color: #1a0a00; font-size: 20px; }
  #btn-draw:hover { background: #f0c040; }
  #btn-draw:disabled { background: #555; color: #999; cursor: default; }
  #btn-reshuffle-deck { background: #3b1a00; color: #c8860a; border: 2px solid #c8860a; }
  #btn-reshuffle-deck:hover { background: #c8860a; color: #1a0a00; }
  #deck-counter {
    font-family: 'Bangers', cursive; font-size: 16px; letter-spacing: 1px;
    color: #c8860a; margin-left: auto;
  }

  #current-card-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: white; border: 4px solid #c8860a; border-radius: 16px;
    overflow: hidden; min-height: 300px; position: relative;
  }
  #current-card-wrap.empty {
    background: #1a0a00; border-color: #3b2000;
  }
  #current-card-img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    display: none; padding: 12px;
  }
  #current-card-placeholder {
    font-family: 'Bangers', cursive; font-size: 28px; letter-spacing: 4px;
    color: #3b2000; text-align: center; padding: 40px;
  }
  #current-card-num {
    position: absolute; top: 8px; left: 12px;
    font-family: 'Bangers', cursive; font-size: 13px; letter-spacing: 1px;
    color: #c8860a; opacity: 0.7;
  }

  /* Right: pulled pile */
  #pulled-pile {
    width: 200px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
  }
  #pulled-title {
    font-family: 'Bangers', cursive; font-size: 16px; letter-spacing: 2px;
    color: #c8860a; text-align: center; border-bottom: 2px solid #c8860a; padding-bottom: 4px;
  }
  #pulled-list {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    gap: 6px; padding-right: 4px;
  }
  #pulled-list::-webkit-scrollbar { width: 4px; }
  #pulled-list::-webkit-scrollbar-thumb { background: #c8860a; border-radius: 2px; }

  .pulled-thumb {
    background: white; border: 2px solid #555; border-radius: 8px;
    overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .pulled-thumb:hover { border-color: #c8860a; transform: scale(1.03); }
  .pulled-thumb.current-highlight { border-color: #f0c040; box-shadow: 0 0 8px #f0c04088; }
  .pulled-thumb img { width: 100%; display: block; object-fit: contain; }

  #pulled-empty {
    font-family: 'Nunito', sans-serif; font-size: 12px; color: #555;
    text-align: center; padding: 20px 0;
  }

  #loading {
    text-align: center; font-family: 'Bangers', cursive; font-size: 28px;
    letter-spacing: 4px; color: #c8860a; padding: 60px;
  }

  @media print {
    #control-bar, #status-bar, #error-msg, #caller-view { display: none !important; }
    body { background: white; }
    #cards-container { padding: 0; }
    .page { margin: 0; box-shadow: none; page-break-after: always; }
  }
</style>
</head>
<body>

<!-- ── Control Bar ── -->
<div id="control-bar">
  <span class="bar-title">✦ LOTERÍA ✦</span>
  <div class="separator"></div>
  <div id="category-buttons"></div>
  <div class="separator"></div>
  <button class="view-btn active" id="btn-view-cards" onclick="switchView('cards')">🖨 PRINT CARDS</button>
  <button class="view-btn" id="btn-view-caller" onclick="switchView('caller')">🎴 CALLER DECK</button>
  <div id="mode-toggle">
    <label for="mode-select">CLICK TO:</label>
    <select id="mode-select">
      <option value="replace">Replace</option>
      <option value="append">Append</option>
    </select>
  </div>
</div>

<div id="status-bar">
  <span id="status-text">Loading manifest…</span>
  <div class="bar-controls">
    <label for="card-count-input">CARDS:</label>
    <input type="number" id="card-count-input" value="32" min="1" max="200" step="1">
    <button class="bar-btn" onclick="regenerate()">⟳ RESHUFFLE</button>
  </div>
</div>

<div id="error-msg"></div>

<!-- ── Cards (print) view ── -->
<div id="cards-view">
  <div id="cards-container"><div id="loading">Loading…</div></div>
</div>

<!-- ── Caller view ── -->
<div id="caller-view">
  <div id="caller-main">
    <div id="caller-controls">
      <button class="caller-btn" id="btn-draw" onclick="drawCard()">▶ DRAW</button>
      <button class="caller-btn" id="btn-reshuffle-deck" onclick="reshuffleDeck()">⟳ NEW DECK</button>
      <span id="deck-counter">— / —</span>
    </div>
    <div id="current-card-wrap" class="empty">
      <span id="current-card-num"></span>
      <img id="current-card-img" src="" alt="">
      <div id="current-card-placeholder">DRAW A CARD</div>
    </div>
  </div>
  <div id="pulled-pile">
    <div id="pulled-title">PULLED (0)</div>
    <div id="pulled-list"><div id="pulled-empty">No cards drawn yet</div></div>
  </div>
</div>

// ── State ────────────────────────────────────────────────────────────────────
let manifest         = {};
let activePool       = [];
let activeCategories = new Set();
let shuffleSeed      = Math.floor(Math.random() * 0xfffff);

// Caller deck state
let callerDeck    = [];   // shuffled array of pool items
let callerIndex   = -1;   // index of current card (-1 = not started)
let pulledCards   = [];   // cards already drawn

// ── Seeded shuffle ────────────────────────────────────────────────────────────
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  function rand() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  }
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomShuffle(arr) {
  return seededShuffle(arr, Math.floor(Math.random() * 0xffffff));
}

// ── Filename → word ──────────────────────────────────────────────────────────
function toWord(filename) {
  let name = filename.replace(/\.[^.]+$/, '');
  name = name.replace(/^[A-Z0-9]+_[A-Z0-9]+_[A-Z0-9]+_/i, '');
  name = name.replace(/([a-z])([A-Z])/g, '$1 $2');
  name = name.replace(/_/g, ' ');
  return name.toLowerCase();
}

// ── Pool ──────────────────────────────────────────────────────────────────────
function poolFromCategory(category) {
  return (manifest[category] || []).map(filename => ({
    word: toWord(filename),
    img:  `Images/${category}/${filename}`,
    folder: category
  }));
}

// ── View switching ────────────────────────────────────────────────────────────
function switchView(view) {
  const isCards = view === 'cards';
  document.getElementById('cards-view').style.display    = isCards ? 'block' : 'none';
  document.getElementById('caller-view').classList.toggle('active', !isCards);
  document.getElementById('btn-view-cards').classList.toggle('active', isCards);
  document.getElementById('btn-view-caller').classList.toggle('active', !isCards);
  // Status bar card count only relevant for print view
  document.querySelector('.bar-controls').style.display = isCards ? 'flex' : 'none';
  if (!isCards) updateDeckCounter();
}

// ══════════════════════════════════════════════════════════════════════════════
//  PRINT CARDS
// ══════════════════════════════════════════════════════════════════════════════
function renderCards(pool) {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  if (pool.length < 16) {
    showError(`Need at least 16 images, found ${pool.length}.`);
    return;
  }
  hideError();

  const CARDS_PER_PAGE = 2;
  const CELLS_PER_CARD = 16;
  const countInput  = document.getElementById('card-count-input');
  const totalCards  = Math.max(1, parseInt(countInput?.value || 32, 10) || 32);

  for (let pageNum = 0; pageNum < Math.ceil(totalCards / CARDS_PER_PAGE); pageNum++) {
    const page = document.createElement('div');
    page.className = 'page';

    const cardsThisPage = Math.min(CARDS_PER_PAGE, totalCards - pageNum * CARDS_PER_PAGE);
    for (let cardOnPage = 0; cardOnPage < cardsThisPage; cardOnPage++) {
      const cardNum  = pageNum * CARDS_PER_PAGE + cardOnPage + 1;
      const shuffled = seededShuffle(pool, (cardNum * 7919) ^ shuffleSeed);
      const selected = shuffled.slice(0, CELLS_PER_CARD);

      const card = document.createElement('div');
      card.className = 'card';

      const header = document.createElement('div');
      header.className = 'card-header';
      header.textContent = '✦ LOTERÍA ✦';
      card.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'card-grid';

      selected.forEach(item => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const img = document.createElement('img');
        img.src     = item.img;
        img.alt     = item.word;
        img.loading = 'lazy';
        cell.appendChild(img);
        // NO label — image already contains the word
        grid.appendChild(cell);
      });

      card.appendChild(grid);
      page.appendChild(card);
    }
    container.appendChild(page);
  }
  updateStatus();
}

function regenerate() {
  shuffleSeed = Math.floor(Math.random() * 0xfffff);
  renderCards([...activePool]);
}

// ══════════════════════════════════════════════════════════════════════════════
//  CALLER DECK
// ══════════════════════════════════════════════════════════════════════════════
function buildCallerDeck() {
  callerDeck  = randomShuffle([...activePool]);
  callerIndex = -1;
  pulledCards = [];
  renderPulledList();
  resetCurrentCard();
  updateDeckCounter();
}

function reshuffleDeck() {
  buildCallerDeck();
}

function drawCard() {
  if (callerIndex >= callerDeck.length - 1) return;
  callerIndex++;
  const item = callerDeck[callerIndex];
  pulledCards.unshift(item); // newest first
  showCurrentCard(item, callerIndex + 1);
  renderPulledList();
  updateDeckCounter();
  document.getElementById('btn-draw').disabled = (callerIndex >= callerDeck.length - 1);
}

function showCurrentCard(item, num) {
  const wrap = document.getElementById('current-card-wrap');
  const img  = document.getElementById('current-card-img');
  const ph   = document.getElementById('current-card-placeholder');
  const numEl = document.getElementById('current-card-num');

  wrap.classList.remove('empty');
  img.src     = item.img;
  img.alt     = item.word;
  img.style.display = 'block';
  ph.style.display  = 'none';
  numEl.textContent = `#${num} of ${callerDeck.length}`;

  // highlight in pulled list
  document.querySelectorAll('.pulled-thumb').forEach((el, i) => {
    el.classList.toggle('current-highlight', i === 0);
  });
}

function resetCurrentCard() {
  const wrap = document.getElementById('current-card-wrap');
  const img  = document.getElementById('current-card-img');
  const ph   = document.getElementById('current-card-placeholder');
  const numEl = document.getElementById('current-card-num');
  wrap.classList.add('empty');
  img.style.display = 'none';
  img.src = '';
  ph.style.display  = 'block';
  numEl.textContent = '';
  document.getElementById('btn-draw').disabled = false;
}

function renderPulledList() {
  const list  = document.getElementById('pulled-list');
  const title = document.getElementById('pulled-title');
  title.textContent = `PULLED (${pulledCards.length})`;

  if (pulledCards.length === 0) {
    list.innerHTML = '<div id="pulled-empty">No cards drawn yet</div>';
    return;
  }

  list.innerHTML = '';
  pulledCards.forEach((item, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'pulled-thumb' + (i === 0 ? ' current-highlight' : '');
    thumb.title = item.word;

    const img = document.createElement('img');
    img.src     = item.img;
    img.alt     = item.word;
    img.loading = 'lazy';

    // clicking a past card re-shows it as "current"
    thumb.onclick = () => {
      document.querySelectorAll('.pulled-thumb').forEach(el => el.classList.remove('current-highlight'));
      thumb.classList.add('current-highlight');
      const deckPos = callerDeck.indexOf(item);
      showCurrentCard(item, deckPos + 1);
    };

    thumb.appendChild(img);
    list.appendChild(thumb);
  });
}

function updateDeckCounter() {
  const remaining = callerDeck.length - (callerIndex + 1);
  document.getElementById('deck-counter').textContent =
    callerDeck.length === 0
      ? '— / —'
      : `${remaining} left · ${callerIndex + 1} drawn · ${callerDeck.length} total`;
}

// ══════════════════════════════════════════════════════════════════════════════
//  SHARED / INIT
// ══════════════════════════════════════════════════════════════════════════════
function handleCategoryClick(category) {
  const mode = document.getElementById('mode-select').value;
  if (mode === 'replace') {
    activeCategories = new Set([category]);
  } else {
    if (activeCategories.has(category)) activeCategories.delete(category);
    else activeCategories.add(category);
    if (activeCategories.size === 0) activeCategories.add(category);
  }
  refreshPool();
  highlightActiveButtons();
}

function refreshPool() {
  activePool = [];
  activeCategories.forEach(cat => { activePool = activePool.concat(poolFromCategory(cat)); });
  renderCards(activePool);
  buildCallerDeck();
}

function highlightActiveButtons() {
  const mode = document.getElementById('mode-select').value;
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.className = `category-btn mode-${mode === 'replace' ? 'replace' : 'add'}`;
    if (activeCategories.has(btn.dataset.category)) btn.classList.add('active');
  });
}

function buildCategoryButtons() {
  const wrap = document.getElementById('category-buttons');
  wrap.innerHTML = '';
  Object.keys(manifest).forEach(category => {
    const btn = document.createElement('button');
    btn.className = 'category-btn mode-replace';
    btn.dataset.category = category;
    btn.textContent = category.toUpperCase();
    btn.onclick = () => handleCategoryClick(category);
    wrap.appendChild(btn);
  });
}

function updateStatus() {
  const cats  = [...activeCategories].join(' + ');
  const total = activePool.length;
  document.getElementById('status-text').textContent =
    `Active: ${cats.toUpperCase()} — ${total} image${total !== 1 ? 's' : ''} in pool`;
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = '⚠ ' + msg; el.style.display = 'block';
}
function hideError() { document.getElementById('error-msg').style.display = 'none'; }

document.getElementById('mode-select').addEventListener('change', highlightActiveButtons);
document.getElementById('card-count-input').addEventListener('change', () => renderCards([...activePool]));

function init() {
  if (typeof MANIFEST === 'undefined' || Object.keys(MANIFEST).length === 0) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('status-text').textContent = 'No manifest found';
    showError('No image data found. Run "node generate-manifest.js" next to this file, then reload.');
    return;
  }
  manifest = MANIFEST;
  buildCategoryButtons();
  const first = Object.keys(manifest)[0];
  activeCategories = new Set([first]);
  refreshPool();
  highlightActiveButtons();
}

init();
</script>
