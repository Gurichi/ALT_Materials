<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #000000;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; display: flex; gap: 30px; }
        
        /* サイドバー（操作パネル） */
        .sidebar { flex: 350px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); height: fit-content; }
        .sidebar h1 { font-size: 1.4rem; margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        
        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; color: #666; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
	    input[type="range"] { width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 	8px; font-size: 1rem; }
        
        .grid-size-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-bottom: 10px; font-size: 1rem; }
        .btn-add { background: var(--accent); color: white; }
        .btn-add:hover { background: #2980b9; }
        .btn-save { background: #27ae60; color: white; }
        .btn-load { background: #f39c12; color: white; }
        .btn-print { background: var(--primary); color: white; margin-top: 20px; font-size: 1.1rem; }

        .word-tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .word-tag { background: #ecf0f1; padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .remove-tag { color: #e74c3c; cursor: pointer; font-weight: bold; }

        /* パズル表示エリア */
        .preview-area { flex: 1; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; min-height: 800px; }
.cell { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-weight: bold; 
    
    /* ここを書き換えます */
    font-family: 'Comic Sans MS', 'Comic Relief', 'Chalkboard SE', 'Comic Neue', sans-serif; 
    
    text-transform: uppercase; 
    user-select: none; 
}

        #puzzle-title { margin-top: 0; font-size: 3rem; letter-spacing: 4px; text-decoration: underline; font-family: fantasy; text-decoration-thickness: 9px;}
        
#grid { 
    display: grid; 
    margin: 30px auto; 
    border: 2px solid #333; 
    width: fit-content; 
    background: #fff; 
    position: relative; /* SVGを正確に重ねるための基準点にします */
}

/* グリッドの真上に重なる透明な線引き用キャンバス */
.answer-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* 下にある文字の選択などを邪魔しないようにします */
    z-index: 10;
}

        
        .word-bank { margin-top: 40px; text-align: left; }
        .word-bank h3 { border-bottom: 2px solid #333; display: inline-block; margin-bottom: 15px; }
        .word-bank-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 1.1rem; font-family: 'Courier New', Courier, monospace; }

        /* 印刷設定 */
        @media print {
            body { background: white; padding: 0; }
            .sidebar { display: none; }
            .preview-area { box-shadow: none; width: 100%; padding: 0; margin: 0; }
            .container { display: block; }
            .cell {  }
            .word-bank-list { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h1>Word Search Setup</h1>
        
        <div class="control-group">
            <div class="grid-size-display">
                <label>Grid Size</label>
                <span id="sizeValue" style="font-size: 30px; font-weight:bold">20 x 20</span>
                <div class="control-group">
    <label>Directions</label>

    <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
        <input type="checkbox" id="allowHorizontal" checked>
        Horizontal
    </label>

    <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
        <input type="checkbox" id="allowVertical" checked>
        Vertical
    </label>

    <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
        <input type="checkbox" id="allowDiagonal" checked>
        Diagonal
    </label>

    <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
        <input type="checkbox" id="allowBackward">
        Allow Backwards
    </label>
</div>
            </div>
            <input type="range" id="sizeRange" min="8" max="30" value="20" oninput="updateGridSize(this.value)">
        </div>
        
        <div class="control-group">
            <label>Puzzle Title</label>
            <input
                type="text"
                id="titleInput"
                placeholder="Enter puzzle title..."
                oninput="updateTitle()"
            >
            <label>Add Word</label>
            <input type="text" id="wordInput" placeholder="Enter word..." onkeypress="if(event.key==='Enter') addWord()">
            <button class="btn btn-add" style="margin-top:10px" onclick="addWord()">Add to Puzzle</button>
        </div>
        
        <div class="word-tag-container" id="wordTagContainer"></div>
        
        <button class="btn btn-save" style="margin-top:20px" onclick="saveJSON()">Download JSON</button>
        <input type="file" id="fileInput" style="display:none" onchange="loadJSON(event)" multiple>
        <button class="btn btn-load" onclick="document.getElementById('fileInput').click()">Upload JSON(s)</button>

        <button class="btn btn-add" onclick="generatePuzzle()">
            🔄 Refresh Grid
        </button>

	<button class="btn" id="btn-toggle-answer" style="background: #e74c3c; color: white;" onclick="toggleAnswerSheet()">
    		👁️ Show Answer Sheet
	</button>

        
        <button class="btn btn-print" onclick="window.print()">Print to A4 / PDF</button>
    </div>

    <div class="preview-area">
        <h2 id="puzzle-title">WORD SEARCH</h2>
        <div id="grid"></div>
        <div class="word-bank">
            <h3>WORDS TO FIND:</h3>
            <div class="word-bank-list" id="wordBankList"></div>
        </div>
    </div>
</div>

<script>
    let words = [];
    let gridSize = 20; 
    
    // Global tracking array to track direction axis signature of each letter
    let directionGrid = [];

    let showAnswer = false;
    let placedWordsData = []; 

    function updateGridSize(val) {
        gridSize = parseInt(val);
        document.getElementById('sizeValue').innerText = `${gridSize} x ${gridSize}`;
        generatePuzzle();
    }

    function addWord() {
        const input = document.getElementById('wordInput');
        const word = input.value.toUpperCase().trim().replace(/[^A-Z]/g, '');
        
        if (!word) return;
        if (word.length > gridSize) {
            alert(`Word is too long for a ${gridSize}x${gridSize} grid!`);
            return;
        }
        if (words.includes(word)) {
            alert("Word already added!");
            return;
        }

        words.push(word);
        input.value = '';
        updateUI();
        generatePuzzle();
    }

    function removeWord(index) {
        words.splice(index, 1);
        updateUI();
        generatePuzzle();
    }
    
    function updateTitle() {
        const input = document.getElementById('titleInput');
        const title = input.value.trim();
        document.getElementById('puzzle-title').innerText = title || 'WORD SEARCH';
    }

    function updateUI() {
        const tagContainer = document.getElementById('wordTagContainer');
        tagContainer.innerHTML = '';
        words.forEach((word, i) => {
            tagContainer.innerHTML += `<div class="word-tag">${word} <span class="remove-tag" onclick="removeWord(${i})">×</span></div>`;
        });

        const bankList = document.getElementById('wordBankList');
        bankList.innerHTML = '';
        [...words].sort().forEach(word => {
            bankList.innerHTML += `<div>□ ${word}</div>`;
        });
    }

function getDirections() {
    const dirs = [];
    const horizontal = document.getElementById('allowHorizontal').checked;
    const vertical = document.getElementById('allowVertical').checked;
    const diagonal = document.getElementById('allowDiagonal').checked;
    const backward = document.getElementById('allowBackward').checked;

    // Forward directions processed safely using strings
    if (horizontal) dirs.push("0,1".split(",").map(Number));
    if (vertical)   dirs.push("1,0".split(",").map(Number));
    if (diagonal)   dirs.push("1,1".split(",").map(Number));

    // Backward directions processed safely using strings
    if (backward) {
        if (horizontal) dirs.push("0,-1".split(",").map(Number));
        if (vertical)   dirs.push("-1,0".split(",").map(Number));
        if (diagonal) {
            dirs.push("-1,-1".split(",").map(Number));
            dirs.push("1,-1".split(",").map(Number));
            dirs.push("-1,1".split(",").map(Number));
        }
    }
    return dirs;
}


function generatePuzzle() {
    const gridDiv = document.getElementById('grid');
    const cellSize = Math.min(550 / gridSize, 45);

    gridDiv.style.gridTemplateColumns = `repeat(${gridSize}, ${cellSize}px)`;

    let grid = Array(gridSize)
        .fill()
        .map(() => Array(gridSize).fill(''));

    // Initialize direction tracking map alongside character map
    directionGrid = Array(gridSize)
        .fill()
        .map(() => Array(gridSize).fill(''));

    const directions = getDirections();
    const sortedWords = [...words].sort((a, b) => b.length - a.length);

    // ==========================================
    // ここからが、ご提示いただいた新しいコードの配置場所です
    // ==========================================
    placedWordsData = [];

    // カラーパレット（単語ごとに異なるランダムな色を割り当てるため）
    const colors = ["#ff7675", "#74b9ff", "#55efc4", "#ffeaa7", "#a29bfe", "#fd79a8", "#fdcb6e", "#00cec9"];

    sortedWords.forEach((word, wordIndex) => {
        let validPlacements = [];
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                for (let d = 0; d < directions.length; d++) {
                    const [dr, dc] = directions[d];
                    if (canPlace(grid, word, r, c, dr, dc)) {
                        validPlacements.push(`${r},${c},${dr},${dc}`);
                    }
                }
            }
        }

        if (validPlacements.length > 0) {
            const randomIndex = Math.floor(Math.random() * validPlacements.length);
            const [selectedRow, selectedCol, selectedDr, selectedDc] = validPlacements[randomIndex].split(",").map(Number);

            placeWord(grid, word, selectedRow, selectedCol, selectedDr, selectedDc);

            // 【新機能】単語の「開始マス」と「終了マス」、そして割り当てられた「色」を保存
            const endRow = selectedRow + selectedDr * (word.length - 1);
            const endCol = selectedCol + selectedDc * (word.length - 1);
            const color = colors[wordIndex % colors.length]; // 色を順番に割り当て
            
            placedWordsData.push({
                startR: selectedRow,
                startC: selectedCol,
                endR: endRow,
                endC: endCol,
                color: color
            });
        } else {
            console.warn(`Could not place word: ${word}`);
        }
    });
    // ==========================================
    // ここまで
    // ==========================================

    // Only show words actually placed in grid
    const validWords = extractWordsFromGrid(grid);

    // Update visible word bank
    const bankList = document.getElementById('wordBankList');
    bankList.innerHTML = '';

    validWords.sort().forEach(word => {
        bankList.innerHTML += `<div>□ ${word}</div>`;
    });

    // Fill remaining cells
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    gridDiv.innerHTML = '';

    for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
            const char = grid[r][c] || letters[Math.floor(Math.random() * letters.length)];
            gridDiv.innerHTML += `
                <div class="cell"
                     style="
                        width:${cellSize}px;
                        height:${cellSize}px;
                        font-size:${cellSize * 0.6}px
                     ">
                    ${char}
                </div>
            `;
        }
    }

    // 【重要】マスを出力し終わった直後に、透明なSVGキャンバスを重ねて追加します
    const svgCanvas = document.createElementNS("http://w3.org", "svg");
    svgCanvas.setAttribute("class", "answer-svg");
    svgCanvas.setAttribute("id", "answerCanvas");
    gridDiv.appendChild(svgCanvas);

    // 解答表示モードの状態を画面に同期
    syncAnswerDisplay();
}


function canPlace(grid, word, row, col, dr, dc) {
    // Generate orientation key profile (e.g. '0,1' or '1,0')
    const currentAxisKey = `${Math.abs(dr)},${Math.abs(dc)}`;

    for (let i = 0; i < word.length; i++) {
        const r = row + dr * i;
        const c = col + dc * i;

        if (r < 0 || c < 0 || r >= gridSize || c >= gridSize) {
            return false;
        }

        if (grid[r][c] !== '') {
            // FIX: Block overlapping words if they share the exact same directional axis line
            if (directionGrid[r][c] === currentAxisKey) {
                return false;
            }

            // Allow intersection ONLY if crossing paths and letter matches perfectly
            if (grid[r][c] !== word[i]) {
                return false;
            }
        }
    }
    return true;
}

function placeWord(grid, word, row, col, dr, dc) {
    const currentAxisKey = `${Math.abs(dr)},${Math.abs(dc)}`;

    for (let i = 0; i < word.length; i++) {
        const r = row + dr * i;
        const c = col + dc * i;

        grid[r][c] = word[i];
        directionGrid[r][c] = currentAxisKey; // Record axis profile signature to grid map
    }
}

function syncAnswerDisplay() {
    // 1. Reset all cells back to normal layout styles
    const cells = document.querySelectorAll('#grid .cell');
    cells.forEach(cell => {
        cell.style.backgroundColor = '';
        cell.style.color = '';
        cell.style.borderRadius = '';
    });

    // 2. If answer mode is disabled, simply update the toggle button and stop
    if (!showAnswer) {
        updateAnswerButton();
        return;
    }

    // 3. Apply custom colors and round the tips of each placed word directly
    placedWordsData.forEach(data => {
        const length = Math.max(
            Math.abs(data.endR - data.startR), 
            Math.abs(data.endC - data.startC)
        ) + 1;

        // Calculate direction step flags
        const dr = data.endR === data.startR ? 0 : (data.endR > data.startR ? 1 : -1);
        const dc = data.endC === data.startC ? 0 : (data.endC > data.startC ? 1 : -1);

        for (let i = 0; i < length; i++) {
            const r = data.startR + dr * i;
            const c = data.startC + dc * i;

            // Target the specific cell index in the flat DOM grid array
            const cellIndex = r * gridSize + c;
            const cell = cells[cellIndex];

            if (cell) {
                // Apply the word's unique marker color (using 40% alpha opacity hex colors)
                cell.style.backgroundColor = data.color + "66"; 
                cell.style.color = "#000000"; // Keep text sharp and visible

                // Beautiful extra touch: Round the outer edges of the start and end letters
                if (i === 0) {
                    cell.style.borderRadius = '50% 0 0 50%'; // Rounded start caps
                } else if (i === length - 1) {
                    cell.style.borderRadius = '0 50% 50% 0'; // Rounded end caps
                }
            }
        }
    });

    updateAnswerButton();
}

// ボタンのUI表現だけを更新する補助関数
function updateAnswerButton() {
    const btn = document.getElementById('btn-toggle-answer');
    if (btn) {
        if (showAnswer) {
            btn.innerText = "Hide Answer Sheet";
            btn.style.background = "#2c3e50";
        } else {
            btn.innerText = "Show Answer Sheet";
            btn.style.background = "#e74c3c";
        }
    }
}

// 通常シートと解答シートを切り替えるトリガー
function toggleAnswerSheet() {
    showAnswer = !showAnswer;
    syncAnswerDisplay();
}



function extractWordsFromGrid(grid) {
    const foundWords = new Set();
    
    // Using string formats to prevent the AI system from dropping coordinates
    const dirStrings = [
        "0,1",   // Horizontal Forward
        "1,0",   // Vertical Forward
        "1,1",   // Diagonal Down-Right
        "0,-1",  // Horizontal Backwards
        "-1,0",  // Vertical Backwards
        "-1,-1", // Diagonal Up-Left
        "1,-1",  // Diagonal Down-Left
        "-1,1"   // Diagonal Up-Right
    ];

    // Convert string arrays back into actual directional numbers safely
    const directions = dirStrings.map(str => {
        const parts = str.split(",");
        return [parseInt(parts[0]), parseInt(parts[1])];
    });

    for (const word of words) {
        outerLoop:
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                for (let d = 0; d < directions.length; d++) {
                    const dr = directions[d][0];
                    const dc = directions[d][1];
                    let match = true;

                    for (let i = 0; i < word.length; i++) {
                        const nr = r + dr * i;
                        const nc = c + dc * i;

                        if (nr < 0 || nc < 0 || nr >= gridSize || nc >= gridSize) {
                            match = false;
                            break;
                        }

                        if (grid[nr][nc] !== word[i]) {
                            match = false;
                            break;
                        }
                    }

                    if (match) {
                        foundWords.add(word);
                        break outerLoop;
                    }
                }
            }
        }
    }
    return [...foundWords];
}

function saveJSON() {
    const data = {
        gridSize,
        words,
        title: document.getElementById('titleInput').value
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wordsearch-${gridSize}x${gridSize}.json`;
    a.click();
}

async function loadJSON(event) {
    for (let file of event.target.files) {
        const text = await file.text();
        const data = JSON.parse(text);
        if (data.words) {
            if (data.title) {
                document.getElementById('titleInput').value = data.title;
                updateTitle();
            }
            words = [...new Set([...words, ...data.words])];
            if (data.gridSize > gridSize) updateGridSize(data.gridSize);
        }
    }
    updateUI();
    generatePuzzle();
}

// Self-initialize layout grid upon startup
generatePuzzle();
</script>

</body>
</html>
