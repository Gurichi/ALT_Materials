<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiery Hotseat Game</title>
<style>
    :root {
        --fire-start: #ff1a00;
        --fire-end: #00ccff;
        --teamA-start: #ff3300;
        --teamA-end: #00ccff;
        --teamB-start: #0066ff;
        --teamB-end: #00ff66;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: #0d0d0d;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        perspective: 1000px;
    }

    h1 {
        margin-top: 20px;
        text-shadow: 0 0 10px var(--fire-start);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    /* メニュー画面 */
    .menu-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        background: rgba(30, 30, 30, 0.8);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(255, 50, 0, 0.5);
        margin-top: 50px;
        transform: rotateX(10deg);
        transform-style: preserve-3d;
        transition: all 0.3s;
    }

    .menu-container:hover {
        transform: rotateX(0deg) translateZ(20px);
    }

    button {
        background: linear-gradient(135deg, #ff5500, #ff1a00);
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(255, 50, 0, 0.4);
    }

    button:hover {
        transform: scale(1.1) translateZ(10px);
        box-shadow: 0 8px 25px rgba(255, 50, 0, 0.8);
        background: linear-gradient(135deg, #ff7700, #ff3300);
    }

    .btn-secondary {
        background: linear-gradient(135deg, #444, #222);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .btn-secondary:hover {
        background: linear-gradient(135deg, #666, #444);
    }

    /* ゲーム画面全体 */
    .game-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* タイマー */
    .timer-bar-container {
        width: 80%;
        height: 30px;
        background-color: #333;
        border-radius: 15px;
        overflow: hidden;
        margin: 20px 0;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    .timer-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, var(--fire-start), var(--fire-end));
        transition: width 0.1s linear, background 0.1s linear;
    }

    /* 単語表示エリア */
    .word-box {
        background: rgba(20, 20, 20, 0.9);
        border: 2px solid #ff5500;
        padding: 40px 60px;
        border-radius: 20px;
        font-size: 3rem;
        font-weight: bold;
        text-shadow: 0 0 15px #ff5500;
        box-shadow: 0 0 30px rgba(255, 85, 0, 0.5);
        margin-bottom: 30px;
        transform: rotateY(0deg) translateZ(50px);
        transition: all 0.3s;
    }

    .word-box:hover {
        transform: rotateY(5deg) translateZ(60px);
    }

    /* チームモード */
    .team-container {
        display: none;
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
    }

    .split-screen {
        display: flex;
        width: 100%;
        height: 100%;
    }

    .team-side {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: background 0.1s linear;
        padding: 20px;
    }

    #team-left {
        background: linear-gradient(135deg, var(--teamA-start), #9900ff);
    }

    #team-right {
        background: linear-gradient(135deg, var(--teamB-start), var(--teamB-end));
    }

    .team-word {
        font-size: 3.5rem;
        font-weight: bold;
        text-align: center;
        text-shadow: 0 0 20px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.4);
        padding: 30px;
        border-radius: 15px;
        width: 80%;
        margin-bottom: 20px;
    }

    /* 単語管理画面 */
    .crud-container {
        display: none;
        flex-direction: column;
        background: rgba(30, 30, 30, 0.9);
        padding: 30px;
        border-radius: 15px;
        width: 80%;
        max-width: 600px;
        box-shadow: 0 0 20px rgba(255, 50, 0, 0.3);
        margin-top: 30px;
    }

    .word-list {
        max-height: 200px;
        overflow-y: auto;
        margin: 15px 0;
        padding: 10px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #111;
    }

    .word-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid #333;
    }

    .word-item input {
        background: #222;
        color: white;
        border: 1px solid #555;
        padding: 5px;
        border-radius: 4px;
        flex-grow: 1;
        margin-right: 10px;
    }

    .word-item button {
        padding: 5px 10px;
        font-size: 1rem;
        margin: 2px;
    }

    .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .input-group input {
        flex-grow: 1;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #555;
        background: #222;
        color: white;
    }

    .file-io-group {
        display: flex;
        gap: 10px;
        margin-top: 15px;
        justify-content: center;
    }

    .controls {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }

    .btn-danger {
        background: linear-gradient(135deg, #ff3300, #cc0000);
    }
    .btn-danger:hover {
        background: linear-gradient(135deg, #ff5500, #ff0000);
    }

    .btn-success {
        background: linear-gradient(135deg, #00cc44, #008822);
    }
    .btn-success:hover {
        background: linear-gradient(135deg, #00ff66, #00aa33);
    }
</style>
</head>
<body>

<h1>Fiery Hotseat Game</h1>

<!-- メニュー -->
<div class="menu-container" id="menu">
    <h2>メインメニュー</h2>
    <button onclick="startGame()">通常ゲーム開始</button>
    <button onclick="startTeamGame()">チームモード開始</button>
    <button class="btn-secondary" onclick="showCrudScreen()">単語の管理 (CRUD)</button>
    <div class="file-io-group">
        <button class="btn-secondary" onclick="saveWordsToJson()">JSON保存</button>
        <button class="btn-secondary" onclick="document.getElementById('file-input').click()">JSONロード</button>
        <input type="file" id="file-input" style="display: none;" accept=".json" onchange="loadWordsFromJson(event)">
    </div>
</div>

<!-- 通常ゲーム画面 -->
<div class="game-screen" id="game-screen">
    <div class="timer-bar-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>
    
    <div class="word-box" id="current-word">単語を引いてください</div>
    
    <div class="controls">
        <button onclick="pullWord()">Pull Word</button>
        <button class="btn-secondary" onclick="resetToMenu()">メニューに戻る</button>
    </div>
</div>

<!-- チームモード画面 -->
<div class="team-container" id="team-screen">
    <div class="timer-bar-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>
    <div class="split-screen">
        <div class="team-side" id="team-left">
            <div class="team-word" id="team-left-word">Pull a word</div>
        </div>
        <div class="team-side" id="team-right">
            <div class="team-word" id="team-right-word">Pull a word</div>
            <button onclick="pullTeamWord()">Pull</button>
        </div>
    </div>
    <button class="btn-secondary" style="position: absolute; bottom: 20px; z-index: 20;" onclick="resetToMenu()">メニューに戻る</button>
</div>

<!-- 単語管理画面 -->
<div class="crud-container" id="crud-screen">
    <h2>単語の管理</h2>
    <div class="input-group">
        <input type="text" id="new-word-input" placeholder="新しい単語を追加...">
        <button class="btn-success" onclick="addWord()">追加</button>
    </div>
    <div class="word-list" id="word-list-box">
        <!-- 単語一覧がJSから挿入されます -->
    </div>
    <button class="btn-secondary" onclick="hideCrudScreen()">メニューに戻る</button>
</div>

<script>
    // 初期単語データ
    let words = ["Fire", "Inferno", "Blaze", "Phoenix", "Magma", "Cinder", "Ember", "Scorch", "Flare", "Ignite"];
    let history = []; // 過去のプル履歴
    let teamMode = false;
    let timeLimit = 30000; // 30秒
    let timeLeft = timeLimit;
    let timerInterval = null;
    let isRunning = false;

    // --- 単語 管理 (CRUD) ---
    function renderWordList() {
        const listContainer = document.getElementById('word-list-box');
        listContainer.innerHTML = '';
        words.forEach((word, index) => {
            const item = document.createElement('div');
            item.className = 'word-item';
            item.innerHTML = `
                <input type="text" id="word-${index}" value="${word}" disabled>
                <div>
                    <button class="btn-secondary" id="edit-btn-${index}" onclick="enableEdit(${index})">編集</button>
                    <button class="btn-danger" onclick="deleteWord(${index})">削除</button>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    function addWord() {
        const input = document.getElementById('new-word-input');
        const word = input.value.trim();
        if (word) {
            words.push(word);
            input.value = '';
            renderWordList();
        }
    }


    function enableEdit(index) {
        const input = document.getElementById(`word-${index}`);
        const btn = document.getElementById(`edit-btn-${index}`);
        
        if (input.disabled) {
            input.disabled = false;
            input.focus();
            btn.textContent = "保存";
        } else {
            input.disabled = true;
            words[index] = input.value.trim();
            btn.textContent = "編集";
            renderWordList();
        }
    }

    function deleteWord(index) {
        words.splice(index, 1);
        renderWordList();
    }

    function showCrudScreen() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('crud-screen').style.display = 'flex';
        renderWordList();
    }

    function hideCrudScreen() {
        document.getElementById('crud-screen').style.display = 'none';
        document.getElementById('menu').style.display = 'flex';
    }

    // --- JSONの保存と読み込み ---
    function saveWordsToJson() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(words));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "hotseat_words.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function loadWordsFromJson(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const loadedWords = JSON.parse(e.target.result);
                if (Array.isArray(loadedWords)) {
                    words = loadedWords;
                    if (document.getElementById('crud-screen').style.display === 'flex') {
                        renderWordList();
                    }
                }
            } catch (err) {
                alert('JSONファイルの読み込みに失敗しました。');
            }
        };
        reader.readAsText(file);
    }

    // --- ゲームの開始と終了 ---
    function startGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.body.style.background = "linear-gradient(135deg, #2a080c, #000000)";
        teamMode = false;
        resetGameTimer();
    }

    function startTeamGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('team-screen').style.display = 'block';
        teamMode = true;
        resetTeamTimer();
    }

    function resetToMenu() {
        clearInterval(timerInterval);
        isRunning = false;
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('team-screen').style.display = 'none';
        document.getElementById('crud-screen').style.display = 'none';
        document.getElementById('menu').style.display = 'flex';
        document.body.style.background = "#0d0d0d";
    }

    // --- タイマーと色変化 (通常) ---
    function resetGameTimer() {
        timeLeft = timeLimit;
        document.getElementById('timer-bar').style.width = '100%';
        document.getElementById('timer-bar').style.background = `linear-gradient(90deg, #ff1a00, #00ccff)`;
        isRunning = true;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isRunning) return;
            
            // 残り時間が少なくなるにつれて減算速度を上げる（カラー変化とバー縮小の加速）
            let speedFactor = 1;
            if (timeLeft < timeLimit * 0.3) {
                speedFactor = 2.5; // 残り30%未満で2.5倍速
            } else if (timeLeft < timeLimit * 0.6) {
                speedFactor = 1.5; // 残り60%未満で1.5倍速
            }
            
            timeLeft -= (100 * speedFactor);
            if (timeLeft < 0) timeLeft = 0;
            
            const percentage = timeLeft / timeLimit;
            
            // プログレスバーの長さ調整
            document.getElementById('timer-bar').style.width = `${percentage * 100}%`;

            // 色の変化 (赤から明るい水色へ)
            const r = Math.floor(255 * percentage);
            const g = Math.floor(26 + (204 - 26) * (1 - percentage));
            const b = Math.floor(0 + (255 - 0) * (1 - percentage));
            document.getElementById('timer-bar').style.background = `rgb(${r},${g},${b})`;

            // 背景も合わせて燃えるような演出
            const bgR = Math.floor(42 * percentage);
            document.body.style.background = `linear-gradient(135deg, rgb(${bgR}, 8, 12), #000000)`;

        }, 100);
    }

    // --- タイマーと色変化 (チームモード) ---
    function resetTeamTimer() {
        const leftSide = document.getElementById('team-left');
        const rightSide = document.getElementById('team-right');
        let teamTimeLeft = timeLimit;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!teamMode) return;
            
            // チームモードでも後半にかけて加速
            let speedFactor = 1;
            if (teamTimeLeft < timeLimit * 0.3) {
                speedFactor = 2.5;
            } else if (teamTimeLeft < timeLimit * 0.6) {
                speedFactor = 1.5;
            }
            
            teamTimeLeft -= (100 * speedFactor);
            if (teamTimeLeft < 0) teamTimeLeft = 0;
            
            const percentage = teamTimeLeft / timeLimit;

            // 左チーム: fiery red (#ff3300) から cool blue (#00ccff) へ
            const leftR = Math.floor(255 * percentage);
            const leftG = Math.floor(51 + (204 - 51) * (1 - percentage));
            const leftB = Math.floor(0 + (255 - 0) * (1 - percentage));
            
            // 右チーム: fiery blue (#0066ff) から cool green (#00ff66) へ
            const rightR = Math.floor(0 * percentage);
            const rightG = Math.floor(102 + (255 - 102) * (1 - percentage));
            const rightB = Math.floor(255 * percentage + 102 * (1 - percentage));

            leftSide.style.background = `linear-gradient(135deg, rgb(${leftR},${leftG},${leftB}), #0d0d0d)`;
            rightSide.style.background = `linear-gradient(135deg, rgb(${rightR},${rightG},${rightB}), #0d0d0d)`;


        }, 100);
    }

    // --- プルロジック (過去2〜3回の重複を回避) ---
    function getRandomWord() {
        if (words.length === 0) return "単語がありません";
        
        if (words.length >= 6) {
            // historyに含まれていない単語を抽出
            let availableWords = words.filter(word => !history.includes(word));
            
            // すべての単語が履歴に入ってしまった場合は履歴をクリアして再取得
            if (availableWords.length === 0) {
                history = [];
                availableWords = [...words];
            }
            
            const randomIndex = Math.floor(Math.random() * availableWords.length);
            const chosenWord = availableWords[randomIndex];
            
            // 履歴に追加し、直近3回分を超えたら古いものを削除
            history.push(chosenWord);
            if (history.length > 3) {
                history.shift();
            }
            
            return chosenWord;
        } else {
            // 6語未満の場合は単純なランダム
            const randomIndex = Math.floor(Math.random() * words.length);
            return words[randomIndex];
        }
    }

    function pullWord() {

        const wordEl = document.getElementById('current-word');
        
        // 3Dアニメーション効果の適用（Y軸の高速回転）
        wordEl.style.transform = 'rotateY(0deg) scale(0.5)';
        wordEl.textContent = getRandomWord();
        
        void wordEl.offsetWidth; // リフローを発生させてアニメーションを強制リセット
        
        wordEl.style.transform = 'rotateY(360deg) scale(1)';

	resetGameTimer();
    }

    function pullTeamWord() {
        const wordEl = document.getElementById(`team-left-word`);
        const wordEr = document.getElementById(`team-right-word`);

        // 3Dひっくり返りアニメーション効果
        wordEl.style.transform = 'rotateX(0deg)';
        wordEl.textContent = getRandomWord();
	wordEr.style.transform = 'rotateX(0deg)';
        wordEr.textContent = getRandomWord();
        
        void wordEl.offsetWidth;
	void wordEr.offsetWidth;
        
        wordEl.style.transform = 'rotateX(360deg)';
	wordEr.style.transform = 'rotateX(360deg)';

	resetGameTimer();
    }
</script>
</body>
</html>
